# Build on GitHub, upload tarball to server, extract + PM2 — no git on server.
# Optional: GitHub secret SERVER_DOTENV_B64 = base64 of .env (do not commit .env).
# Create:  printf '%s' "$(cat .env)" | base64 -w0
name: Deploy industrial-realty-server (artifact)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pack source bundle (no node_modules — install on server for native ABI)
        run: tar -czf server-release.tgz package.json package-lock.json src scripts deploy

      - name: Upload bundle to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT }}
          source: server-release.tgz
          target: /tmp/

      - name: Extract and restart PM2
        uses: appleboy/ssh-action@v1
        env:
          SERVER_DOTENV_B64: ${{ secrets.SERVER_DOTENV_B64 }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT }}
          command_timeout: 20m
          envs: SERVER_DOTENV_B64
          script: |
            set -ex
            # Non-interactive SSH often skips ~/.bashrc — Baota Node / PM2 may be off PATH.
            if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc" || true; fi
            if [ -f /www/server/nvm/nvm.sh ]; then . /www/server/nvm/nvm.sh && nvm use default 2>/dev/null || true; fi
            export PATH="/www/server/panel/pyenv/bin:/usr/local/bin:/usr/bin:$PATH"
            shopt -s nullglob
            for d in /www/server/nodejs/*/bin; do
              [ -d "$d" ] && export PATH="$d:$PATH"
            done
            shopt -u nullglob
            command -v node
            command -v npm
            command -v pm2
            # Strip CR / trailing spaces from secrets (common when copy-pasting in GitHub).
            DEPLOY_DIR="$(printf '%s' "${{ secrets.SERVER_API_APP_DIR }}" | tr -d '\r' | sed 's/[[:space:]]*$//')"
            APP_NAME="$(printf '%s' "${{ secrets.SERVER_API_PM2_NAME }}" | tr -d '\r' | sed 's/[[:space:]]*$//')"
            test -n "${DEPLOY_DIR}"
            test -n "${APP_NAME}"
            # Secret path may not exist yet on a fresh server — create parents, then extract there.
            mkdir -p "${DEPLOY_DIR}"
            test -d "${DEPLOY_DIR}"
            test -f /tmp/server-release.tgz
            cd "${DEPLOY_DIR}"
            rm -rf src scripts deploy
            tar -xzf /tmp/server-release.tgz -C "${DEPLOY_DIR}"
            rm -f /tmp/server-release.tgz
            if [ -n "${SERVER_DOTENV_B64:-}" ]; then
              printf '%s' "$SERVER_DOTENV_B64" | base64 -d > "${DEPLOY_DIR}/.env"
              chmod 600 "${DEPLOY_DIR}/.env"
            fi
            npm ci --omit=dev
            # "pm2 restart" often exits 1 after deploy (stale cwd, crash on boot, wrong interpreter).
            # Recreate the process from the current directory so PM2 always tracks the right path.
            pm2 delete "${APP_NAME}" 2>/dev/null || true
            if ! pm2 start src/index.js --name "${APP_NAME}" --update-env; then
              pm2 logs "${APP_NAME}" --lines 80 --nostream 2>/dev/null || pm2 logs --lines 40 --nostream || true
              exit 1
            fi
            pm2 save || true
