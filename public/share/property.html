<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>房源展示</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 32px; }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .notice {
      font-size: 12px;
      color: #64748b;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .section { margin-top: 20px; }
    .section h2 { font-size: 14px; color: #cbd5e1; margin-bottom: 10px; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px;
      background: #1e293b;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .video-box {
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    .video-box video {
      width: 100%;
      max-height: 420px;
      display: block;
      background: #000;
    }
    .state {
      text-align: center;
      padding: 48px 16px;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .state.err { color: #fca5a5; }
    .hero {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      border-radius: 14px;
      background: #1e293b;
      margin-bottom: 12px;
      pointer-events: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="wrap" id="app">
    <div class="state">加载中…</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search)
      var token = (params.get('token') || '').trim()
      var app = document.getElementById('app')

      function apiBase() {
        var fromQuery = (params.get('api') || '').trim().replace(/\/$/, '')
        if (fromQuery) return fromQuery
        return location.origin.replace(/\/$/, '')
      }

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;')
      }

      function showError(msg) {
        app.innerHTML = '<div class="state err">' + esc(msg) + '</div>'
      }

      function bindNoSave(root) {
        root.querySelectorAll('img').forEach(function (img) {
          img.draggable = false
          img.addEventListener('contextmenu', function (e) { e.preventDefault() })
        })
        root.querySelectorAll('video').forEach(function (v) {
          v.setAttribute('controlsList', 'nodownload noremoteplayback')
          v.setAttribute('disablePictureInPicture', 'true')
          v.setAttribute('playsinline', 'true')
          v.addEventListener('contextmenu', function (e) { e.preventDefault() })
        })
      }

      if (!token) {
        showError('链接无效：缺少分享凭证')
        return
      }

      fetch(apiBase() + '/api/public/property-share?token=' + encodeURIComponent(token), {
        method: 'GET',
        headers: { Accept: 'application/json' },
      })
        .then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok || body.code !== 200) {
              throw new Error(body.message || '加载失败')
            }
            return body.result
          })
        })
        .then(function (data) {
          var images = Array.isArray(data.mediaImages) ? data.mediaImages : []
          var videos = Array.isArray(data.mediaVideos) ? data.mediaVideos : []
          if (!images.length && !videos.length) {
            showError('暂无可展示的图片或视频')
            return
          }
          var html = ''
          html += '<span class="badge">只读浏览 · 不可转发下载</span>'
          html += '<h1>' + esc(data.title || '房源展示') + '</h1>'
          if (data.specLine) html += '<p class="sub">' + esc(data.specLine) + '</p>'
          html += '<p class="notice">本页仅供查看房源图片与视频，请勿截图传播。链接过期后将无法访问。</p>'

          if (images.length) {
            html += '<img class="hero" src="' + esc(images[0]) + '" alt="" />'
          }
          if (images.length > 1) {
            html += '<div class="section"><h2>全部图片</h2><div class="grid">'
            images.forEach(function (url) {
              html += '<img src="' + esc(url) + '" alt="" />'
            })
            html += '</div></div>'
          }
          if (videos.length) {
            html += '<div class="section"><h2>视频</h2>'
            videos.forEach(function (url) {
              html += '<div class="video-box"><video src="' + esc(url) + '" controls preload="metadata"></video></div>'
            })
            html += '</div>'
          }
          app.innerHTML = html
          bindNoSave(app)
        })
        .catch(function (e) {
          showError(e && e.message ? e.message : '加载失败')
        })

      document.addEventListener('contextmenu', function (e) { e.preventDefault() })
    })()
  </script>
</body>
</html>
